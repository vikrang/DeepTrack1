# Render blueprint. With Firebase cloud storage configured (DEEPTRACK_FIREBASE_CREDENTIALS_JSON),
# the portfolio lives in Firestore, so the persistent disk below is OPTIONAL — you can switch
# plan to "free" and delete the "disk:" block and still never lose data on redeploy.
# Dashboard -> Blueprints -> New Blueprint Instance -> pick this repo.
services:
  - type: web
    name: deeptrack
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DEEPTRACK_DATA_DIR
        value: /var/data
      - key: DEEPTRACK_DB
        value: /var/data/tracker.db
      - key: DEEPTRACK_HTTPS
        value: "1"
      - key: DEEPTRACK_PASSWORD_LOGIN
        value: "0"
      - key: DEEPTRACK_SECRET_KEY
        generateValue: true
      - key: DEEPTRACK_FIREBASE_PROJECT
        sync: false
      - key: DEEPTRACK_FIREBASE_API_KEY
        sync: false
      - key: DEEPTRACK_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: DEEPTRACK_ALLOWED_EMAILS
        sync: false
      - key: DEEPTRACK_ADMIN_EMAILS
        sync: false
      # Firebase cloud storage: paste the full service-account JSON key here.
      # Makes Firestore the source of truth; data survives redeploys even on the free plan.
      - key: DEEPTRACK_FIREBASE_CREDENTIALS_JSON
        sync: false